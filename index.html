<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="KAI Televideo: un servizio statico ispirato al televideo italiano dei primi anni Novanta.">
  <title>KAI Televideo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section id="screen" class="screen" tabindex="0" aria-label="KAI Televideo">
      <div class="scanlines" aria-hidden="true"></div>
      <header class="status-line" aria-hidden="true">
        <span id="service">KAI TELEVIDEO</span>
        <span id="page-indicator">P100</span>
        <span id="clock">--:--:--</span>
      </header>
      <pre id="page" class="page" aria-live="polite"></pre>
      <footer class="help-line" aria-label="Comandi da tastiera">
        <span class="help-item"><kbd>0–9</kbd><small>pagina</small></span>
        <span class="help-item"><kbd>Invio</kbd><small>vai</small></span>
        <span class="help-item"><kbd>←</kbd><kbd>→</kbd><small>sfoglia</small></span>
        <span class="help-item"><kbd>H</kbd><small>indice</small></span>
        <span class="help-item"><kbd>C</kbd><small>video</small></span>
        <span class="help-item"><kbd>M</kbd><small>audio</small></span>
      </footer>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
