<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A static, explorable Teletext service inspired by the mystery of pre-web afternoons.">
  <title>KA TEXT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section id="screen" class="screen" tabindex="0" aria-label="Teletext viewer">
      <div class="scanlines" aria-hidden="true"></div>
      <header class="status-line" aria-hidden="true">
        <span id="service">KA TEXT</span>
        <span id="page-indicator">P100</span>
        <span id="clock">--:--:--</span>
      </header>
      <pre id="page" class="page" aria-live="polite"></pre>
      <footer class="help-line">
        <span><kbd>0–9</kbd> page</span>
        <span><kbd>Enter</kbd> go</span>
        <span><kbd>←/→</kbd> browse</span>
        <span><kbd>H</kbd> home</span>
        <span><kbd>C</kbd> CRT</span>
      </footer>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
